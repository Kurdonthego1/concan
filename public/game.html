<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concan — Game Room</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body class="game-page">

  <!-- Toast / error banner -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <!-- ========== TOP BAR ========== -->
  <header class="top-bar">
    <span class="game-title">Concan</span>

    <div class="room-info">
      Room: <span id="room-code-display">------</span>
    </div>

    <div id="players-list" class="players-list" aria-label="Players" aria-live="polite">
      <!-- Player chips inserted by game.js -->
    </div>

    <div id="phase-indicator" class="phase-indicator phase-wait">Waiting...</div>
  </header>

  <!-- ========== TABLE AREA ========== -->
  <main class="table-area" id="table-area">

    <!-- Piles row: draw pile + discard pile -->
    <div class="piles-row">

      <div class="pile-container">
        <span class="pile-label">Draw Pile</span>
        <div id="draw-pile"></div>
        <span class="pile-count" id="draw-pile-count"></span>
      </div>

      <div class="pile-container">
        <span class="pile-label">Discard</span>
        <div id="discard-pile"></div>
        <span class="pile-count" id="discard-pile-count"></span>
      </div>

      <!-- Draw from deck button (shown during draw phase as alternative) -->
      <button id="draw-from-deck-btn" class="btn btn-secondary btn-sm hidden">
        Draw from Deck
      </button>

    </div>

    <!-- Table melds -->
    <div class="melds-area">
      <div class="melds-area-title">Table Melds</div>
      <div id="melds-container" class="melds-container">
        <div class="melds-empty">No melds on the table yet</div>
      </div>
    </div>

  </main>

  <!-- ========== YOUR HAND ========== -->
  <footer class="hand-area">

    <div class="hand-controls">
      <span class="hand-label">Your Hand</span>

      <div id="action-buttons" class="action-buttons hidden">
        <button id="place-meld-btn" class="btn btn-secondary btn-sm" disabled>
          Place Meld (3+ cards)
        </button>
        <button id="discard-btn" class="btn btn-danger btn-sm" disabled>
          Discard (1 card)
        </button>
      </div>
    </div>

    <div id="hand-cards" class="hand-cards" aria-label="Your cards">
      <!-- Cards rendered by game.js via CardRenderer -->
    </div>

  </footer>

  <!-- ========== SIDEBAR / GAME LOG ========== -->
  <aside class="sidebar">
    <div class="sidebar-title">Game Log</div>
    <div id="game-log" class="game-log" aria-live="polite" aria-label="Game log">
      <!-- Log entries appended by game.js -->
    </div>
  </aside>

  <!-- ========== GAME OVER OVERLAY ========== -->
  <div id="game-over-overlay" class="game-over-overlay" role="dialog" aria-modal="true" aria-labelledby="winner-name">
    <div class="game-over-box">
      <h2>Game Over</h2>
      <div id="winner-name" class="winner-name"></div>

      <ul id="final-scores-list" class="scores-list"></ul>

      <button id="play-again-btn" class="btn btn-primary" style="max-width: 200px; margin: 0 auto;">
        Back to Lobby
      </button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/js/cardRenderer.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
